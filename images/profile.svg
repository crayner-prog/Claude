  <!-- Drive sprocket -->
  <circle cx="322" cy="400" r="14" fill="#2a2520"/>
  <circle cx="322" cy="400" r="8" fill="#3a3530"/>
  <!-- Idler -->
  <circle cx="498" cy="400" r="14" fill="#2a2520"/>
  <circle cx="498" cy="400" r="8" fill="#3a3530"/>
