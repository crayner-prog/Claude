  <line x1="370" y1="384" x2="370" y2="416" stroke="#2a2520" stroke-width="2.5"/>
  <line x1="390" y1="384" x2="390" y2="416" stroke="#2a2520" stroke-width="2.5"/>
  <line x1="410" y1="384" x2="410" y2="416" stroke="#2a2520" stroke-width="2.5"/>
  <line x1="430" y1="384" x2="430" y2="416" stroke="#2a2520" stroke-width="2.5"/>
  <line x1="450" y1="384" x2="450" y2="416" stroke="#2a2520" stroke-width="2.5"/>
