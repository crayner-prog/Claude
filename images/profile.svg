<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="prsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a7a5a"/>
      <stop offset="40%" stop-color="#8a9a6a"/>
      <stop offset="70%" stop-color="#a0aa78"/>
      <stop offset="100%" stop-color="#b8b888"/>
    </linearGradient>
    <linearGradient id="prground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7a50"/>
      <stop offset="40%" stop-color="#7a6a40"/>
      <stop offset="100%" stop-color="#5a4a28"/>
    </linearGradient>
  </defs>
  <!-- Warm sky -->
  <rect width="800" height="600" fill="url(#prsky)"/>
  <!-- Warm light glow -->
  <ellipse cx="600" cy="150" rx="200" ry="150" fill="#c8a840" opacity="0.1"/>
  <!-- Surrounding forest - left dense -->
  <path d="M0,150 l10,-70 l8,48 l12,-75 l10,58 l8,-65 l12,45 l10,-72 l8,55 l12,-68 l10,50 l8,-60 l12,42 l10,-68 l8,52 l12,-65 l10,48 l8,-58 l12,40 l10,-65 l8,50 L280,180 L280,450 L0,450Z" fill="#1a3a18"/>
  <!-- Forest right -->
  <path d="M580,180 l10,-70 l8,48 l12,-75 l10,58 l8,-65 l12,45 l10,-72 l8,55 l12,-68 l10,50 l8,-60 l12,42 l10,-68 l8,52 L800,150 L800,450 L580,450Z" fill="#1a3a18"/>
  <!-- Mid-ground trees (sparser, clearing edge) -->
