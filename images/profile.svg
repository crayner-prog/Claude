  <path d="M0,480 Q200,470 400,475 Q600,470 800,480 L800,600 L0,600Z" fill="#5a4a28" opacity="0.5"/>
  <!-- Tree stumps in clearing -->
  <ellipse cx="300" cy="360" rx="10" ry="5" fill="#5a4a30"/>
  <rect x="294" y="354" width="12" height="8" fill="#6a5a38"/>
  <ellipse cx="520" cy="355" rx="8" ry="4" fill="#5a4a30"/>
  <rect x="515" y="350" width="10" height="7" fill="#6a5a38"/>
  <!-- Warm atmosphere overlay -->
  <rect width="800" height="600" fill="#c8a040" opacity="0.05"/>
