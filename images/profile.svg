  <circle cx="340" cy="400" r="10" fill="#2a2520"/>
  <circle cx="340" cy="400" r="5" fill="#3a3530"/>
  <circle cx="380" cy="400" r="10" fill="#2a2520"/>
  <circle cx="380" cy="400" r="5" fill="#3a3530"/>
  <circle cx="420" cy="400" r="10" fill="#2a2520"/>
  <circle cx="420" cy="400" r="5" fill="#3a3530"/>
  <circle cx="460" cy="400" r="10" fill="#2a2520"/>
  <circle cx="460" cy="400" r="5" fill="#3a3530"/>
  <circle cx="490" cy="400" r="10" fill="#2a2520"/>
