  <path d="M520,220 l8,-50 l6,35 l10,-55 l8,42 l6,-48 l10,32 l8,-52 l6,38 L640,200 L640,350 L520,350Z" fill="#1e3e1c" opacity="0.8"/>
  <!-- Clearing ground -->
