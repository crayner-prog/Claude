  <line x1="300" y1="200" x2="200" y2="600" stroke="#5a5a40" stroke-width="3" opacity="0.5"/>
  <line x1="500" y1="200" x2="600" y2="600" stroke="#5a5a40" stroke-width="3" opacity="0.5"/>
  <!-- Tire ruts -->
  <path d="M370,200 L290,600" stroke="#6a6050" stroke-width="4" fill="none" opacity="0.3"/>
  <path d="M430,200 L510,600" stroke="#6a6050" stroke-width="4" fill="none" opacity="0.3"/>
  <!-- Light filtering through trees -->
  <ellipse cx="400" cy="200" rx="60" ry="30" fill="#8a9a70" opacity="0.1"/>
  <ellipse cx="380" cy="350" rx="40" ry="80" fill="#8a9a70" opacity="0.08"/>
  <!-- Shadows across road from trees -->
  <path d="M320,300 L460,320" stroke="#4a5a40" stroke-width="15" fill="none" opacity="0.12"/>
  <path d="M280,420 L520,440" stroke="#4a5a40" stroke-width="18" fill="none" opacity="0.12"/>
  <path d="M240,530 L560,550" stroke="#4a5a40" stroke-width="20" fill="none" opacity="0.1"/>
