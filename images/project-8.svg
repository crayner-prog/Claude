<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="p8sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a7078"/>
      <stop offset="50%" stop-color="#8a8a88"/>
      <stop offset="100%" stop-color="#9a9890"/>
    </linearGradient>
    <linearGradient id="p8rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8880"/>
      <stop offset="50%" stop-color="#7a7870"/>
      <stop offset="100%" stop-color="#6a6860"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#p8sky)"/>
  <!-- Distant tree line -->
  <path d="M0,150 l8,-30 l6,20 l10,-35 l8,26 l6,-28 l10,20 l8,-32 l6,24 l10,-30 l8,22 l6,-26 l10,18 l8,-30 l6,22 l10,-28 l8,20 l6,-32 l10,24 l8,-26 l6,18 l10,-30 l8,22 l6,-28 l10,20 l8,-32 l6,24 l10,-30 l8,22 l6,-26 l10,18 L400,150" fill="#2a4a28" opacity="0.5"/>
  <path d="M600,160 l8,-30 l6,20 l10,-35 l8,26 l6,-28 l10,20 l8,-32 l6,24 l10,-30 l8,22 l6,-26 l10,18 l8,-30 l6,22 L800,150 L800,200 L600,200Z" fill="#2a4a28" opacity="0.5"/>
  <!-- Quarry walls - stepped rock face -->
  <!-- Back wall -->
  <path d="M100,160 L100,250 L700,250 L700,160 Q600,140 500,150 Q400,130 300,145 Q200,135 100,160Z" fill="#7a7870"/>
  <!-- Rock face texture - back -->
  <line x1="150" y1="170" x2="150" y2="250" stroke="#6a6860" stroke-width="2" opacity="0.5"/>
  <line x1="250" y1="160" x2="250" y2="250" stroke="#6a6860" stroke-width="2" opacity="0.5"/>
  <line x1="350" y1="150" x2="350" y2="250" stroke="#6a6860" stroke-width="2" opacity="0.5"/>
  <line x1="450" y1="155" x2="450" y2="250" stroke="#6a6860" stroke-width="2" opacity="0.5"/>
  <line x1="550" y1="148" x2="550" y2="250" stroke="#6a6860" stroke-width="2" opacity="0.5"/>
  <line x1="650" y1="158" x2="650" y2="250" stroke="#6a6860" stroke-width="2" opacity="0.5"/>
  <!-- Horizontal cracks -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#6a6860" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="225" x2="700" y2="225" stroke="#6a6860" stroke-width="1" opacity="0.3"/>
  <!-- Second bench / step -->
  <path d="M50,250 L50,340 L750,340 L750,250Z" fill="#8a8878"/>
  <line x1="50" y1="290" x2="750" y2="290" stroke="#7a7868" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="315" x2="750" y2="315" stroke="#7a7868" stroke-width="1" opacity="0.3"/>
  <!-- Rock face texture - second bench -->
  <line x1="120" y1="250" x2="120" y2="340" stroke="#7a7868" stroke-width="2" opacity="0.4"/>
  <line x1="220" y1="250" x2="220" y2="340" stroke="#7a7868" stroke-width="2" opacity="0.4"/>
  <line x1="380" y1="250" x2="380" y2="340" stroke="#7a7868" stroke-width="2" opacity="0.4"/>
  <line x1="500" y1="250" x2="500" y2="340" stroke="#7a7868" stroke-width="2" opacity="0.4"/>
  <line x1="620" y1="250" x2="620" y2="340" stroke="#7a7868" stroke-width="2" opacity="0.4"/>
  <!-- Quarry floor -->
  <path d="M0,340 Q100,335 200,338 Q400,342 600,338 Q700,335 800,340 L800,600 L0,600Z" fill="url(#p8rock)"/>
  <!-- Gravel/crushed rock piles -->
  <!-- Pile 1 - large -->
  <path d="M500,320 Q530,280 570,290 Q600,270 640,285 Q670,275 700,300 Q720,310 730,340 Q700,345 650,342 Q600,345 550,342 Q520,344 500,340Z" fill="#8a8878"/>
  <path d="M510,330 Q540,300 570,305 Q600,290 630,300 Q660,295 690,315" stroke="#9a9888" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Pile 2 - smaller -->
  <path d="M150,340 Q170,310 200,315 Q230,300 260,318 Q280,328 290,340 Q260,345 220,342 Q180,344 150,340Z" fill="#9a9888"/>
  <!-- Crusher machine silhouette -->
  <g transform="translate(350,300)">
    <!-- Base frame -->
    <rect x="-60" y="10" width="120" height="40" fill="#3a3a38"/>
    <!-- Hopper -->
    <path d="M-50,-30 L-40,10 L40,10 L50,-30Z" fill="#4a4a48"/>
    <path d="M-45,-25 L-38,5 L38,5 L45,-25Z" fill="#3a3a38"/>
    <!-- Conveyor belt coming out -->
    <path d="M60,30 L160,80" stroke="#3a3a38" stroke-width="8"/>
    <path d="M60,38 L160,88" stroke="#3a3a38" stroke-width="8"/>
    <!-- Conveyor supports -->
    <line x1="90" y1="50" x2="90" y2="80" stroke="#3a3a38" stroke-width="3"/>
    <line x1="120" y1="62" x2="120" y2="92" stroke="#3a3a38" stroke-width="3"/>
    <line x1="150" y1="75" x2="150" y2="105" stroke="#3a3a38" stroke-width="3"/>
    <!-- Machinery housing -->
    <rect x="-30" y="-15" width="25" height="25" fill="#4a4a48"/>
    <rect x="10" y="-10" width="20" height="20" fill="#4a4a48"/>
  </g>
  <!-- Dump truck silhouette -->
  <g transform="translate(200,370)">
    <!-- Wheels -->
    <circle cx="0" cy="30" r="12" fill="#2a2a28"/>
    <circle cx="60" cy="30" r="12" fill="#2a2a28"/>
    <!-- Chassis -->
    <rect x="-15" y="12" width="90" height="18" fill="#3a3a38"/>
    <!-- Dump bed -->
    <path d="M15,12 L15,-20 L75,-20 L75,12Z" fill="#5a5a48"/>
    <!-- Cab -->
    <rect x="-15" y="-10" width="28" height="22" fill="#5a5a48"/>
    <rect x="-12" y="-7" width="14" height="12" fill="#6a7a8a" opacity="0.5"/>
  </g>
  <!-- Scattered rocks on quarry floor -->
  <ellipse cx="100" cy="400" rx="15" ry="8" fill="#7a7868" opacity="0.6"/>
  <ellipse cx="300" cy="420" rx="12" ry="6" fill="#7a7868" opacity="0.6"/>
  <ellipse cx="550" cy="410" rx="18" ry="9" fill="#7a7868" opacity="0.6"/>
  <ellipse cx="680" cy="430" rx="14" ry="7" fill="#7a7868" opacity="0.6"/>
  <ellipse cx="150" cy="450" rx="10" ry="5" fill="#7a7868" opacity="0.5"/>
  <ellipse cx="450" cy="440" rx="13" ry="6" fill="#7a7868" opacity="0.5"/>
  <!-- Access road -->
  <path d="M0,420 Q100,410 200,415 Q300,420 350,425" stroke="#8a7a60" stroke-width="25" fill="none"/>
  <!-- Dust cloud effect -->
  <ellipse cx="400" cy="350" rx="80" ry="30" fill="#9a9890" opacity="0.15"/>
  <ellipse cx="350" cy="340" rx="50" ry="20" fill="#9a9890" opacity="0.1"/>
  <!-- Foreground gravel -->
  <path d="M0,500 Q200,490 400,495 Q600,490 800,500 L800,600 L0,600Z" fill="#6a6858" opacity="0.5"/>
  <!-- Overall dusty atmosphere -->
  <rect width="800" height="600" fill="#8a8880" opacity="0.08"/>
</svg>