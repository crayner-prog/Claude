name: GolfLaunchMonitor
options:
  bundleIdPrefix: com.golflaunchmonitor
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.2"
  createIntermediateGroups: true

targets:
  GolfLaunchMonitor:
    type: application
    platform: iOS
    sources:
      - path: GolfLaunchMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.golflaunchmonitor.app
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    info:
      path: GolfLaunchMonitor/Info.plist
      properties:
        CFBundleDisplayName: "Launch Monitor"
        NSCameraUsageDescription: "GolfLaunchMonitor needs camera access to analyze your golf shots and measure launch metrics including ball speed, club speed, spin rate, and trajectory."
        NSPhotoLibraryUsageDescription: "GolfLaunchMonitor needs photo library access to analyze recorded golf shots."
        NSPhotoLibraryAddUsageDescription: "GolfLaunchMonitor saves recorded golf shots to your photo library for review."
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UIUserInterfaceStyle: Dark
